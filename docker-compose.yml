version: '3.8'

services:
  doc-bot:
    build: .
    container_name: doc-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Core configuration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=3000
      - CONCURRENCY_LIMIT=${CONCURRENCY_LIMIT:-3}
      - MAX_COST_PER_INVOCATION=${MAX_COST_PER_INVOCATION:-2.0}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CLONE_BASE_DIR=/tmp/doc-bot
      - NODE_ENV=${NODE_ENV:-production}

      # GitLab configuration (optional)
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET}

      # GitHub configuration (optional)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}

    volumes:
      # Persist git clones across restarts (optional, can reduce clone overhead)
      - doc-bot-tmp:/tmp/doc-bot

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  doc-bot-tmp:
